
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form action="/contact-me">

        <label for="username">UserName:</label>
        <input type="text" id="username" placeholder="Enter your name" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        <br><br>

        <label for="village">Village:</label>
        <input type="text" id="village" placeholder="Enter your village">
        <br><br>

        <label for="police">Police Station:</label>
        <input type="text" id="police" placeholder="Enter police station">
        <br><br>

        <label for="district">District:</label>
        <input type="text" id="district" placeholder="Enter district">
        <br><br>

        <label for="pincode">Pincode:</label>
        <input type="text" id="pincode" placeholder="Enter pincode" maxlength="6">
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" placeholder="Enter mobile number" maxlength="10">
        <br><br>

        <label for="parent">Parents Mobile Number:</label>
        <input type="tel" id="parent" placeholder="Enter parents mobile number" maxlength="10">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password">
        <br><br>

        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
